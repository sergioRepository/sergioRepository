<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Sergio Daniel Flórez - Junior Backend Developer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#4ade80"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#22d3ee" stroke-opacity=".06"/></pattern>
<radialGradient id="glow" cx=".85" cy=".2" r=".6"><stop offset="0" stop-color="#22d3ee" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx=".1" cy=".95" r=".5"><stop offset="0" stop-color="#a78bfa" stop-opacity=".16"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect width="1200" height="360" rx="18"/></clipPath>
</defs>
<style>
.mono{font-family:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace} .sans{font-family:'Segoe UI', Inter, Helvetica, Arial, sans-serif}
.fade{animation:fade .9s ease backwards}
.d1{animation-delay:.2s}.d2{animation-delay:.7s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:1.9s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.fl{animation:fl 6s ease-in-out infinite} .fl2{animation:fl 7.5s ease-in-out infinite reverse}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.sweep{animation:sw 4s linear infinite}
@keyframes sw{from{transform:translateX(-300px)}to{transform:translateX(1200px)}}
</style>
<g clip-path="url(#card)">
<rect width="1200" height="360" fill="url(#bg)"/>
<rect width="1200" height="360" fill="url(#grid)"/>
<rect width="1200" height="360" fill="url(#glow)"/>
<rect width="1200" height="360" fill="url(#glow2)"/>
<text x="1170" y="300" text-anchor="end" class="mono" font-size="220" font-weight="700" fill="url(#acc)" opacity=".07">{ }</text>
<!-- window bar -->
<rect width="1200" height="44" fill="#ffffff" fill-opacity=".03"/>
<circle cx="32" cy="22" r="6" fill="#ff5f56"/><circle cx="54" cy="22" r="6" fill="#ffbd2e"/><circle cx="76" cy="22" r="6" fill="#27c93f"/>
<text x="600" y="27" text-anchor="middle" class="mono" font-size="13" fill="#6b7a99">~/backend — zsh</text>
<!-- floating tokens -->
<g class="mono" font-size="15" fill="#22d3ee"><text class="fl" x="930" y="100" opacity=".55">@SpringBootApplication</text></g>
<g class="mono" font-size="15" fill="#4ade80"><text class="fl2" x="975" y="165" opacity=".5">def main():</text></g>
<g class="mono" font-size="15" fill="#a78bfa"><text class="fl" x="1010" y="215" opacity=".5">SELECT *</text></g>
<g class="mono" font-size="15" fill="#22d3ee"><text class="fl2" x="945" y="318" opacity=".45">git push origin main</text></g>
<!-- content -->
<g class="mono" font-size="20"><text class="fade d1" x="70" y="108"><tspan fill="#4ade80">$</tspan><tspan fill="#9fb0cf"> whoami</tspan></text><rect class="cur" x="172" y="92" width="11" height="20" fill="#4ade80"/></g>
<text class="fade d2 sans" x="68" y="190" font-size="62" font-weight="800" fill="url(#acc)">Sergio Daniel Flórez</text>
<text class="fade d3 mono" x="70" y="235" font-size="21" fill="#e6edf3"><tspan fill="#22d3ee">&lt;</tspan>Junior Backend Developer &amp; Tecnólogo en Sistemas Informáticos<tspan fill="#22d3ee"> /&gt;</tspan></text>
<text class="fade d4 mono" x="70" y="282" font-size="16.5" fill="#8b9ab8">// Desarrollo de soluciones de software eficientes y seguras,</text>
<text class="fade d5 mono" x="70" y="308" font-size="16.5" fill="#8b9ab8">// con enfoque en backend, bases de datos, automatización y ciberseguridad.</text>
<!-- bottom bar -->
<rect y="352" width="1200" height="8" fill="url(#acc)"/>
<rect class="sweep" y="352" width="300" height="8" fill="#fff" opacity=".35"/>
</g>
<rect x=".5" y=".5" width="1199" height="359" rx="18" fill="none" stroke="#22d3ee" stroke-opacity=".25"/>
</svg>